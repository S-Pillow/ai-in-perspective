name: News daily collection and publication

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/news-review.yml']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/news-review.yml'
      - 'scripts/news/**'
      - 'src/data/newsFeeds.mjs'
      - 'tests/news-feed.test.mjs'

permissions: {}
concurrency:
  group: news-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'S-Pillow/ai-in-perspective' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.report }}
      state: ${{ steps.report.outputs.state }}
      candidate: ${{ steps.report.outputs.candidate }}
      sha256: ${{ steps.report.outputs.sha256 }}
      render_digest: ${{ steps.report.outputs.render_digest }}
      base_sha: ${{ steps.report.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test offline collector and site contracts
        run: npm run check:content && npm run news:check
      - name: Collect into isolated runner checkout
        run: |
          set -euo pipefail
          cp src/data/news-snapshot.json "$RUNNER_TEMP/news-before.json"
          npm run --silent news:collect > "$RUNNER_TEMP/news-result.json"
          git diff --name-only | awk '$0 != "src/data/news-snapshot.json" { bad=1 } END { exit bad }'
      - name: Validate actual candidate and build
        run: npm run news:check && npm run build
      - name: Prepare validated private review report
        id: report
        env:
          RUN_URL: https://github.com/S-Pillow/ai-in-perspective/actions/runs/${{ github.run_id }}
        run: |
          node scripts/news/review-report.mjs "$RUNNER_TEMP/news-before.json" src/data/news-snapshot.json "$RUNNER_TEMP/news-result.json" "$(git rev-parse HEAD)" "$RUN_URL"
  record:
    needs: collect
    if: github.repository == 'S-Pillow/ai-in-perspective' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Record validated review result in private issue 8
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BASE64: ${{ needs.collect.outputs.report }}
        run: |
          set -euo pipefail
          test "$(gh api repos/S-Pillow/ai-in-perspective --jq '.private')" = true
          test "$(gh api repos/S-Pillow/ai-in-perspective/issues/8 --jq '.state')" = open
          test -n "$REPORT_BASE64"
          printf '%s' "$REPORT_BASE64" | base64 --decode > "$RUNNER_TEMP/news-review.md"
          gh issue comment 8 --repo S-Pillow/ai-in-perspective --body-file "$RUNNER_TEMP/news-review.md"

  publish:
    needs: [collect, record]
    if: github.repository == 'S-Pillow/ai-in-perspective' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.base_sha }}
          persist-credentials: true
      - name: Validate exact main base and candidate fingerprint
        env:
          BASE_SHA: ${{ needs.collect.outputs.base_sha }}
          CANDIDATE: ${{ needs.collect.outputs.candidate }}
          EXPECTED_SHA256: ${{ needs.collect.outputs.sha256 }}
          COLLECTION_STATE: ${{ needs.collect.outputs.state }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "$(git rev-parse HEAD)"
          test "$BASE_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$CANDIDATE"
          printf '%s' "$CANDIDATE" | base64 --decode > "$RUNNER_TEMP/news-candidate.json"
          test "$(sha256sum "$RUNNER_TEMP/news-candidate.json" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          case "$COLLECTION_STATE" in
            changed)
              if cmp -s "$RUNNER_TEMP/news-candidate.json" src/data/news-snapshot.json; then exit 1; fi
              ;;
            unchanged|retain_previous)
              cmp -s "$RUNNER_TEMP/news-candidate.json" src/data/news-snapshot.json
              ;;
            *) exit 1 ;;
          esac
      - name: Commit changed snapshot only
        if: needs.collect.outputs.state == 'changed'
        env:
          BASE_SHA: ${{ needs.collect.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          cp "$RUNNER_TEMP/news-candidate.json" src/data/news-snapshot.json
          test "$(git diff --name-only)" = src/data/news-snapshot.json
          git add -- src/data/news-snapshot.json
          test "$(git diff --cached --name-only)" = src/data/news-snapshot.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(news): publish validated daily source snapshot'
          git push origin HEAD:refs/heads/main
          echo "Published source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact snapshot on public production
        env:
          RENDER_DIGEST: ${{ needs.collect.outputs.render_digest }}
        run: |
          set -euo pipefail
          [[ "$RENDER_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 12 "https://ai-in-perspective.vercel.app/explore/news?news-check=$RENDER_DIGEST" -o "$RUNNER_TEMP/news-live.html" &&
              grep -Fq "data-news-snapshot-sha256=\"$RENDER_DIGEST\"" "$RUNNER_TEMP/news-live.html"; then
              echo "Public News verified: $RENDER_DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public snapshot did not match; inspect Vercel delivery before retrying. No further deploy attempted."
          exit 1
