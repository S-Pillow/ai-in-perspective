name: Museum foundation checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Content contracts and Astro build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate content contracts
        run: npm run check:content
      - name: Validate News RSS/Atom contracts (offline)
        run: npm run news:check
      - name: Astro static build
        run: npm run build
      - name: Probe permitted News feeds (read-only diagnostics, not publication)
        run: node scripts/news/collect.mjs --preview-json
        continue-on-error: true
